name: Webinar app quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [nov17-session-isolation]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --include=dev --no-audit --no-fund
      - run: npm run check
      - run: npx vitest run server/sessionIsolation.test.ts server/brevo.test.ts
      - run: npm run build
      # Full legacy suite remains informative; several old tests require live Brevo
      # secrets or still assert historical pre-Render download behavior.
      - run: npm test
        continue-on-error: true
