name: Webinar app quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [nov17-session-isolation]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --include=dev --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
