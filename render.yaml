# Render Blueprint for the webinar registration app.
# Import this in Render: New → Blueprint → connect this repo. It provisions the
# Postgres database, the web service, and the hourly sequence cron in one pass.
# You will still set the secret values (marked sync:false) in the dashboard.

databases:
  - name: webinar-db
    databaseName: webinar
    plan: starter
    postgresMajorVersion: "16"

services:
  # --- Web service (registration site + owner dashboard + API) ---
  - type: web
    name: webinar-app
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build && npx drizzle-kit migrate
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webinar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # fresh secret is fine — no prior emails sent
      - key: CRON_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false                  # paste your Brevo key
      - key: ADMIN_EMAIL
        sync: false                  # your dashboard login email
      - key: ADMIN_PASSWORD_HASH
        sync: false                  # bcrypt hash (see runbook step 2)
      - key: PUBLIC_URL
        sync: false                  # e.g. https://whatentrepreneursneedtoknow.com

  # --- Hourly sequence dispatch (replaces the Manus cron heartbeat) ---
  # Runs every hour; the job itself checks real Eastern time internally, so DST
  # never shifts the send window. It calls the web service with the shared secret.
  - type: cron
    name: webinar-sequence-cron
    runtime: node
    plan: starter
    schedule: "0 * * * *"
    buildCommand: "true"
    startCommand: >
      curl -fsS -X POST
      -H "x-cron-secret: $CRON_SECRET"
      "$PUBLIC_URL/api/scheduled/sequence"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: webinar-app
          envVarKey: CRON_SECRET
      - key: PUBLIC_URL
        sync: false                  # same value as the web service PUBLIC_URL
